name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select an available iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          devices="$(xcrun simctl list devices available)"
          printf '%s\n' "$devices"

          simulator_id="$(printf '%s\n' "$devices" | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$simulator_id" ]]; then
            simulator_id="$(printf '%s\n' "$devices" | awk -F '[()]' '/iPad/ { print $2; exit }')"
          fi

          if [[ -z "$simulator_id" ]]; then
            echo "No usable iOS Simulator was found on this runner." >&2
            exit 1
          fi

          echo "Using iOS Simulator: $simulator_id"
          echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build and test native app
        run: >-
          xcodebuild
          -project ios/Runner.xcodeproj
          -scheme Runner
          -destination 'id=${{ steps.simulator.outputs.simulator_id }}'
          -destination-timeout 120
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
